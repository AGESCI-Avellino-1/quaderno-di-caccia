# Production: everything in Docker. Configure first with scripts/configure-prod.sh,
# which writes .env (including COMPOSE_FILE), then: docker compose up -d --build
name: qdc

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qdc}
      POSTGRES_USER: ${POSTGRES_USER:-qdc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD mancante in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  web:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-qdc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-qdc}
    volumes:
      # Private uploads (BuonaStrada exports, later receipts): never served directly.
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Through Django's host and HTTPS checks, like a real request from the proxy.
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request as u;
          h = os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0];
          u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/salute',
          headers={'Host': h, 'X-Forwarded-Proto': 'https'}), timeout=5)
      interval: 30s
      start_period: 30s
      retries: 3

  app:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      # Reached only by the reverse proxy on the host (nginx-host, apache-host).
      - "127.0.0.1:${QDC_HTTP_PORT:-8080}:80"

volumes:
  db-data:
  media:
