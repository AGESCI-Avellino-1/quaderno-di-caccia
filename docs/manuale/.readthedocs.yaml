# Read the Docs (DEC-231): the user manual, one version per release. Its own project on
# the group's account: set "docs/manuale/.readthedocs.yaml" as the configuration file path
# in the project's advanced settings. The installation guide will be another project.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"

sphinx:
  configuration: docs/manuale/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
