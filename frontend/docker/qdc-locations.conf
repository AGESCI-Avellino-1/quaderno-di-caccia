# Shared by every server block: PWA files + Django paths.
root /usr/share/nginx/html;
client_max_body_size 20m;
server_tokens off;

# Django: API, authentication (allauth), admin and its static files. Keep in sync with
# DJANGO_PATHS in vite.config.ts.
location ~ ^/(api|_allauth|accounts|admin|static|mailpit)/ {
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $qdc_proto;
    proxy_read_timeout 120s;
    # Django down or restarting (DEC-270). Only nginx's own errors: Django's answers,
    # the maintenance 503 too, pass untouched (proxy_intercept_errors is off).
    error_page 502 503 504 /errori/50x.html;
}

location = /errori/50x.html {
    include /etc/nginx/qdc/qdc-sicurezza.conf;
    add_header Cache-Control "no-store";
}

# Service worker and manifest are never cached, or devices keep an old app forever.
location = /sw.js {
    include /etc/nginx/qdc/qdc-sicurezza.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}
location = /manifest.webmanifest {
    include /etc/nginx/qdc/qdc-sicurezza.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# pdf.js's worker is a module: without a JavaScript type (nginx's list may not have .mjs) the
# browser refuses it, given nosniff.
location ~ ^/assets/.*\.mjs$ {
    include /etc/nginx/qdc/qdc-sicurezza.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    types { }
    default_type text/javascript;
    try_files $uri =404;
}

# Hashed build files: cache forever.
location /assets/ {
    include /etc/nginx/qdc/qdc-sicurezza.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Single-page app: every other path is index.html (vue-router).
location / {
    include /etc/nginx/qdc/qdc-sicurezza.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
