# Included in every location that sets headers (nginx drops server-level add_header
# as soon as a location defines its own).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS lives here, not in the server blocks, for the same reason. Browsers ignore it on
# plain http, so it is harmless behind a TLS proxy on the host. Django adds it to its own
# responses (SECURE_HSTS_SECONDS).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
